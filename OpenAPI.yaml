# -----------------------------------------------------------------------------
# Components & Schemas
# -----------------------------------------------------------------------------
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter JWT bearer token received from `/api/users/login`.
    DeviceIdHeader:
      type: apiKey
      in: header
      name: X-Device-Id
      description: Client device unique fingerprint for concurrent session validation.

  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operation completed successfully

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Invalid credentials or operation failed
        code:
          type: string
          example: AUTH_FAILED

    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        mustChangePassword:
          type: boolean
          example: false
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      properties:
