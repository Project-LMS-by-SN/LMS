openapi: 3.1.0
info:
  title: Modern Library Management System (LMS) API
  version: 1.0.0
  description: |
    Production-ready RESTful API for the Library Management System (LMS), connected to **MongoDB Atlas**.
    Provides multi-tenant branch isolation, student lifecycle management, attendance kiosk & staff portals,
    seat & shift allocations, cashier desk fee payments, SaaS subscriptions via Razorpay, and Role-Based Access Control (RBAC).
servers:
  - url: http://localhost:3000
    description: Local Development Server
  - url: https://lms-4kly.vercel.app
    description: Production / Cloud Staging Server

tags:
  - name: System
    description: Health check and root platform endpoints
  - name: Authentication & Users
    description: User authentication, JWT issuance, profile, device security, and subscriptions
  - name: Staff Management
    description: Owner-only staff account creation, credential resets, and deletions
  - name: Admission Requests
    description: Public online admission applications and staff review queue
  - name: Students
    description: Comprehensive student bio, admission flow, profile, and updates
  - name: Attendance
    description: Staff check-in/out, active monitors, and self-service public attendance kiosks
  - name: Dashboard
    description: Operational KPI metrics, revenue charts, seat occupancy, and urgent notifications
  - name: Seats
    description: Library physical seat management, layout grids, and bulk generator
  - name: Shifts
    description: Study time slot definitions and capacity scheduling
  - name: Fee Plans
    description: Membership pricing packages, reserved/unreserved durations, and fees
  - name: Student Validities
    description: Active student subscription validities, date ranges, and dues tracking
  - name: Student Shift Assignments
    description: Relational bindings between student validity, shifts, and reserved seats
  - name: Payments & Cashier
    description: Offline and cashier fee ledger, UTR recording, and renewal transactions
  - name: Razorpay Subscriptions
    description: SaaS library owner subscription upgrades, coupon validations, and invoices
  - name: Payment Modes
    description: Active payment options (Cash, UPI, Card, Net Banking)
  - name: Expenses
    description: Library branch operational expense management (Rent, Electricity, Maintenance)
  - name: Reports
    description: Daily attendance logs and annual revenue business intelligence reports

paths:
  /:
    get:
      tags:
        - System
      summary: Health check & service banner
      description: Returns service banner confirming backend server is operational.
      responses:
        '200':
          description: Service running
          content:
            text/plain:
              schema:
                type: string
                example: Library Management Backend is running

  # ---------------------------------------------------------------------------
  # Authentication & Users
  # ---------------------------------------------------------------------------
  /api/users/login:
    post:
      tags:
        - Authentication & Users
      summary: User login (Owner or Staff)
      description: |
        Authenticates user credentials against MongoDB Atlas. Enforces single-device concurrent session rules.
        Rate-limited to prevent brute-force attacks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: admin@admin.com
                password:
                  type: string
                  format: password
                  example: Password123!
                deviceId:
                  type: string
                  example: device_98af2b0c1
                forceLogin:
                  type: boolean
                  default: false
                  description: Force logout of previous device session if active
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Missing email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Account already logged in on another device
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many login attempts

  /api/users/logout:
    post:
      tags:
        - Authentication & Users
      summary: User logout
      description: Terminates active device session and invalidates session token.
      security:
        - BearerAuth: []
        - DeviceIdHeader: []
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/users/forgot-password:
    post:
      tags:
        - Authentication & Users
      summary: Request password reset email / token
      description: Generates a secure time-limited password reset token sent to owner email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: admin@admin.com
      responses:
        '200':
          description: Reset instructions generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/users/reset-password:
    get:
      tags:
        - Authentication & Users
      summary: Validate reset password token
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Token is valid
        '400':
          description: Invalid or expired token
    post:
      tags:
        - Authentication & Users
      summary: Reset account password with token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - password
              properties:
                token:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/users/profile:
    get:
      tags:
        - Authentication & Users
      summary: Get current user profile and subscription metadata
      security:
        - BearerAuth: []
        - DeviceIdHeader: []
      responses:
        '200':
          description: User profile details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
    put:
      tags:
        - Authentication & Users
      summary: Update user profile and library contact details
      security:
        - BearerAuth: []
        - DeviceIdHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Admin User
                phone:
                  type: string
                  example: "+91 9876543210"
                libraryName:
                  type: string
                  example: Knowledge Haven Library
                address:
                  type: string
                  example: 123 Learning Street, Sector 62, Noida, UP
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/users/change-password:
    put:
      tags:
        - Authentication & Users
      summary: Change account password
      security:
        - BearerAuth: []
        - DeviceIdHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - oldPassword
                - newPassword
              properties:
                oldPassword:
                  type: string
                  format: password
                newPassword:
                  type: string
                  format: password
      responses:
        '200':
          description: Password updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/users/qr-info:
    get:
      tags:
        - Authentication & Users
      summary: Get branch QR tokens for public portals
      description: Returns admission and attendance QR codes and public kiosk URLs for current branch.
      security:
        - BearerAuth: []
        - DeviceIdHeader: []
      responses:
        '200':
          description: Branch QR tokens
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      admissionToken:
                        type: string
                      attendanceToken:
                        type: string
                      admissionUrl:
                        type: string
                      attendanceUrl:
                        type: string
                      branchCode:
                        type: string
                      branchName:
                        type: string

  /api/users/subscription:
    put:
      tags:
        - Authentication & Users
      summary: Update subscription tier (Owner only)
      security:
        - BearerAuth: []
        - DeviceIdHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tier
              properties:
                tier:
                  type: string
                  enum: [FREE, STARTER, PRO_100, PRO_200, ENTERPRISE]
                expiryDays:
                  type: integer
                  default: 30
      responses:
        '200':
          description: Subscription updated

  /api/users/activate-pending-plan:
    post:
      tags:
        - Authentication & Users
      summary: Activate queued advance renewal plan immediately
      security:
        - BearerAuth: []
        - DeviceIdHeader: []
      responses:
        '200':
          description: Plan activated

  /api/users/account:
    delete:
      tags:
        - Authentication & Users
      summary: Permanently delete owner account and branch data
      security:
        - BearerAuth: []
        - DeviceIdHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Account deleted

  # ---------------------------------------------------------------------------
  # Staff Management
  # ---------------------------------------------------------------------------
  /api/users/staff:
    get:
      tags:
        - Staff Management
      summary: List staff accounts for branch (Owner only)
      security:
        - BearerAuth: []
        - DeviceIdHeader: []
      responses:
        '200':
          description: List of staff accounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/StaffUser'
    post:
      tags:
        - Staff Management
      summary: Create new staff account (Owner only)
      security:
        - BearerAuth: []
        - DeviceIdHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                  example: Librarian Staff
                email:
                  type: string
                  format: email
                  example: staff1@library.com
                password:
                  type: string
                  format: password
                  example: StaffPass123!
      responses:
        '201':
          description: Staff created successfully

  /api/users/staff/{id}/password:
    put:
      tags:
        - Staff Management
      summary: Reset staff account password (Owner only)
      security:
        - BearerAuth: []
        - DeviceIdHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - newPassword
              properties:
                newPassword:
                  type: string
                  format: password
      responses:
        '200':
          description: Staff password reset

  /api/users/staff/{id}:
    delete:
      tags:
        - Staff Management
      summary: Delete staff account (Owner only)
      security:
        - BearerAuth: []
        - DeviceIdHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Staff account removed

  # ---------------------------------------------------------------------------
  # Admission Requests
  # ---------------------------------------------------------------------------
  /api/admission-requests/branch-info:
    get:
      tags:
        - Admission Requests
      summary: Public library branch info for admission QR code
      description: Returns library name, address, active study shifts, and fee plans for student registration form.
      parameters:
        - name: token
          in: query
          description: Branch admission token from QR poster
          schema:
            type: string
        - name: branchCode
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Branch admission metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchInfoResponse'
        '404':
          description: Invalid admission QR token

  /api/admission-requests:
    get:
      tags:
        - Admission Requests
      summary: List pending admission applications
      security:
        - BearerAuth: []
        - DeviceIdHeader: []
      responses:
        '200':
          description: List of pending requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdmissionRequest'
    post:
      tags:
        - Admission Requests
      summary: Submit online admission application (Public)
      description: Student self-service application form submitted via public QR link.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fullName
                - mobile
              properties:
                token:
                  type: string
                fullName:
                  type: string
                  example: Rohit Kumar
                email:
                  type: string
                  format: email
                  example: rohit@example.com
                mobile:
                  type: string
                  example: "9876543210"
                gender:
                  type: string
                  enum: [MALE, FEMALE, OTHER]
                  default: OTHER
                dob:
                  type: string
                  format: date
                  example: "2002-05-15"
                address:
                  type: string
                  example: "Sector 62, Noida"
                aadharNumber:
                  type: string
                  example: "123456789012"
                profilePhotoUrl:
                  type: string
                preferredShiftId:
                  type: integer
                preferredFeePlanId:
                  type: integer
                remarks:
                  type: string
      responses:
        '201':
          description: Admission application received
        '400':
          description: Duplicate pending application or missing required fields

  /api/admission-requests/{id}:
    get:
      tags:
        - Admission Requests
      summary: Get admission request by ID
      security:
        - BearerAuth: []
        - DeviceIdHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Request details
    delete:
      tags:
        - Admission Requests
      summary: Reject or delete admission application
      security:
        - BearerAuth: []
        - DeviceIdHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Request removed

  # ---------------------------------------------------------------------------
  # Students
  # ---------------------------------------------------------------------------
  /api/students/next-code:
    get:
      tags:
        - Students
      summary: Generate next student code & registration number
      security:
        - BearerAuth: []
        - DeviceIdHeader: []
      responses:
        '200':
          description: Next sequential identifiers
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      student_code:
                        type: string
                        example: STD00024
                      reg_no:
                        type: string
                        example: REG20261000024

  /api/students/search:
    get:
      tags:
        - Students
      summary: Search students by query
      description: Searches by student full name, mobile number, student code, or registration number.
      security:
        - BearerAuth: []
        - DeviceIdHeader: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/StudentSummary'

  /api/students/shifts:
    get:
      tags:
        - Students
      summary: Get active shifts for student assignment
      security:
        - BearerAuth: []
        - DeviceIdHeader: []
      responses:
        '200':
          description: List of active shifts

  /api/students/fee-plans:
    get:
      tags:
        - Students
      summary: Get active fee plans for student admission
      security:
        - BearerAuth: []
        - DeviceIdHeader: []
      responses:
        '200':
          description: List of active fee plans

  /api/students/seats/{shiftId}:
    get:
      tags:
        - Students
      summary: Get available seats for a specific study shift
      security:
        - BearerAuth: []
        - DeviceIdHeader: []
      parameters:
        - name: shiftId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Seats availability map for the given shift

  /api/students:
    get:
      tags:
        - Students
      summary: List all branch students
      description: Paginated and filterable student directory.
      security:
        - BearerAuth: []
        - DeviceIdHeader: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, SUSPENDED, DISABLED, ALL]
        - name: planId
          in: query
          schema:
            type: integer
        - name: shiftId
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Student list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Student'
    post:
      tags:
        - Students
      summary: Create student profile record
      security:
        - BearerAuth: []
        - DeviceIdHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStudentPayload'
      responses:
        '201':
          description: Student profile created

  /api/students/admit:
    post:
      tags:
        - Students
      summary: Atomic student admission transaction
      description: |
        Executes a single-shot atomic transaction in MongoDB:
        1. Creates student bio profile.
        2. Assigns membership validity period based on fee plan.
        3. Allocates reserved seats or unreserved study shifts.
        4. Logs cashier fee payment with invoice receipt.
        5. Updates admission request status if submitted via online application queue.
      security:
        - BearerAuth: []
        - DeviceIdHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdmitStudentPayload'
      responses:
        '201':
          description: Student admitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdmitStudentResponse'
        '400':
          description: Validation error or duplicate mobile/aadhar

  /api/students/{id}/profile:
    get:
      tags:
        - Students
      summary: Full student profile with validities, shifts, and payment history
      security:
        - BearerAuth: []
        - DeviceIdHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Full profile document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProfile'

  /api/students/{id}:
    get:
      tags:
        - Students
      summary: Get student by ID
      security:
        - BearerAuth: []
        - DeviceIdHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Student details
    put:
      tags:
        - Students
      summary: Update student bio profile
      security:
        - BearerAuth: []
        - DeviceIdHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStudentPayload'
      responses:
        '200':
          description: Student profile updated
    delete:
      tags:
        - Students
      summary: Soft-delete student record (Owner only)
      security:
        - BearerAuth: []
        - DeviceIdHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Student soft-deleted

  /api/students/{id}/details:
    put:
      tags:
        - Students
      summary: Reconfigure student seat, shifts, or fee plan
      security:
        - BearerAuth: []
        - DeviceIdHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fee_plan_id:
                  type: integer
                shift_ids:
                  type: array
                  items:
                    type: integer
                seat_id:
                  type: integer
                access_type:
                  type: string
                  enum: [RESERVED, UNRESERVED]
      responses:
        '200':
          description: Student assignment details updated

  # ---------------------------------------------------------------------------
  # Attendance
  # ---------------------------------------------------------------------------
  /api/attendance/branch-info:
    get:
      tags:
        - Attendance
      summary: Public branch info for Attendance Kiosk
      description: Returns branch details to verify kiosk setup.
      parameters:
        - name: token
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Branch details

  /api/attendance/public-search:
    get:
      tags:
        - Attendance
      summary: Self-service attendance kiosk student lookup (Public)
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Student match with today's attendance state

  /api/attendance/public-checkin:
    post:
      tags:
        - Attendance
      summary: Kiosk quick check-in / check-out (Public)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - studentId
                - action
              properties:
                token:
                  type: string
                studentId:
                  type: integer
                action:
                  type: string
                  enum: [checkin, checkout]
      responses:
        '200':
          description: Action recorded

  /api/attendance:
    get:
      tags:
        - Attendance
      summary: List attendance records
      security:
        - BearerAuth: []
        - DeviceIdHeader: []
      parameters:
        - name: date
          in: query
          schema:
            type: string
            format: date
            example: "2026-10-26"
        - name: studentId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [PRESENT, ABSENT]
      responses:
        '200':
          description: Attendance records

  /api/attendance/search:
    get:
      tags:
        - Attendance
      summary: Staff attendance student lookup
      security:
        - BearerAuth: []
        - DeviceIdHeader: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Student attendance search match

  /api/attendance/active:
    get:
      tags:
        - Attendance
      summary: List students currently present in library
      security:
        - BearerAuth: []
        - DeviceIdHeader: []
      responses:
        '200':
          description: Active check-in list

  /api/attendance/check-in:
    post:
      tags:
        - Attendance
      summary: Staff student check-in
      security:
        - BearerAuth: []
        - DeviceIdHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - studentId
              properties:
                studentId:
                  type: integer
                shiftAssignmentId:
                  type: integer
                remarks:
                  type: string
      responses:
        '200':
          description: Checked in successfully

  /api/attendance/check-out:
    post:
      tags:
        - Attendance
      summary: Staff student check-out
      security:
        - BearerAuth: []
        - DeviceIdHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                attendanceId:
                  type: integer
                studentId:
                  type: integer
                remarks:
                  type: string
      responses:
        '200':
          description: Checked out successfully

  /api/attendance/checkout-all:
    post:
      tags:
        - Attendance
      summary: Check out all currently present students (End of day)
      security:
        - BearerAuth: []
        - DeviceIdHeader: []
      requestBody:
        content:
          application/json:
            schema:
